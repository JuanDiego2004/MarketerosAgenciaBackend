spring.application.name=agencia
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://marketerosfrontend.onrender.com,http://localhost:5173,http://localhost:3000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${DB_USERNAME:postgres.rkvmtmhqwwqqasyrgdmz}
# Obligatoria: evita intentar la conexión con una contraseña vacía si falta la variable.
spring.datasource.password=${DB_PASSWORD}
# Supabase Transaction Pooler (puerto 6543) no admite prepared statements del servidor.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

crm.mockaroo.habilitado=${CRM_MOCKAROO_HABILITADO:false}
crm.mockaroo.api-key=${CRM_MOCKAROO_API_KEY:}
crm.whatsapp.version=${CRM_WHATSAPP_VERSION:${CRM_META_VERSION:v27.0}}
crm.whatsapp.token=${CRM_WHATSAPP_TOKEN:}
crm.whatsapp.phone-id=${CRM_WHATSAPP_PHONE_ID:}
crm.whatsapp.app-secret=${CRM_WHATSAPP_APP_SECRET:}
crm.whatsapp.verify-token=${CRM_WHATSAPP_VERIFY_TOKEN:}
crm.email.from=${CRM_SMTP_FROM:}
crm.public-url=${CRM_PUBLIC_URL:}
crm.brevo.api-key=${BREVO_API_KEY:}
crm.brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
crm.automatizaciones.habilitadas=${CRM_AUTOMATIZACIONES_HABILITADAS:false}
spring.jpa.properties.hibernate.format_sql=true
supabase.url=${SUPABASE_URL:https://rkvmtmhqwwqqasyrgdmz.supabase.co}
supabase.api-key=${SUPABASE_PUBLISHABLE_KEY:}
