spring.application.name=agencia
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${DB_USERNAME:postgres.rkvmtmhqwwqqasyrgdmz}
spring.datasource.password=${DB_PASSWORD:}
# Supabase Transaction Pooler (puerto 6543) no admite prepared statements del servidor.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

crm.meta.token=${CRM_META_TOKEN:}
crm.meta.version=${CRM_META_VERSION:v27.0}
crm.google.client-id=${CRM_GOOGLE_CLIENT_ID:}
crm.google.client-secret=${CRM_GOOGLE_CLIENT_SECRET:}
crm.google.refresh-token=${CRM_GOOGLE_REFRESH_TOKEN:}
crm.google.developer-token=${CRM_GOOGLE_ADS_DEVELOPER_TOKEN:}
crm.google.login-customer-id=${CRM_GOOGLE_ADS_LOGIN_CUSTOMER_ID:}
crm.google.ads-version=${CRM_GOOGLE_ADS_VERSION:v26}
crm.whatsapp.token=${CRM_WHATSAPP_TOKEN:}
crm.whatsapp.phone-id=${CRM_WHATSAPP_PHONE_ID:}
crm.whatsapp.app-secret=${CRM_WHATSAPP_APP_SECRET:}
crm.whatsapp.verify-token=${CRM_WHATSAPP_VERIFY_TOKEN:}
crm.twilio.account-sid=${CRM_TWILIO_ACCOUNT_SID:}
crm.twilio.auth-token=${CRM_TWILIO_AUTH_TOKEN:}
crm.twilio.from=${CRM_TWILIO_FROM:}
crm.smtp.from=${CRM_SMTP_FROM:}
crm.public-url=${CRM_PUBLIC_URL:}
crm.smtp.one-click=${CRM_SMTP_ONE_CLICK:false}
crm.automatizaciones.habilitadas=${CRM_AUTOMATIZACIONES_HABILITADAS:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.jpa.properties.hibernate.format_sql=true
supabase.url=${SUPABASE_URL:https://rkvmtmhqwwqqasyrgdmz.supabase.co}
supabase.api-key=${SUPABASE_PUBLISHABLE_KEY:}
